<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prigionieri nel cubo — VR</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><style>body{margin:0}#help{position:absolute;z-index:5;top:12px;left:12px;max-width:280px;background:#102038dd;color:white;padding:12px;border-radius:12px;font:14px system-ui;pointer-events:none}#help small{display:block;margin-top:6px}</style></head><body><div id="help"><b>Missione: prigionieri nel cubo</b><small>Guardati intorno. Conta facce, spigoli e vertici. Tocca il pulsante VR in basso a destra e inserisci il telefono nel visore.</small></div><a-scene background="color:#071222" renderer="antialias:true" vr-mode-ui="enabled:true"><a-entity id="room"></a-entity><a-entity position="0 0 0"><a-camera position="0 0 0" look-controls="enabled:true" wasd-controls="enabled:false"><a-entity cursor="fuse:false;rayOrigin:mouse"></a-entity></a-camera></a-entity><a-entity light="type:ambient;intensity:1"></a-entity></a-scene><script>
const room=document.querySelector('#room');const s=6;const h=s/2;
function entity(tag,attributes){const e=document.createElement(tag);for(const [k,v] of Object.entries(attributes))e.setAttribute(k,v);room.appendChild(e);return e}
// translucent inward-visible faces, centered at the viewer
entity('a-box',{position:'0 0 0',width:s,height:s,depth:s,material:'color:#166b9b;opacity:0.13;transparent:true;side:double;depthWrite:false'});
// 12 edges as cylinders
function edge(a,b){const mid=a.map((v,i)=>(v+b[i])/2),delta=b.map((v,i)=>v-a[i]),len=Math.hypot(...delta);const e=entity('a-cylinder',{position:mid.join(' '),radius:0.035,height:len,material:'color:#ffcc55;emissive:#996000;emissiveIntensity:0.45'});const from=new THREE.Vector3(0,1,0),to=new THREE.Vector3(...delta).normalize();e.object3D.quaternion.setFromUnitVectors(from,to)}
for(let axis=0;axis<3;axis++){for(const u of [-h,h])for(const v of [-h,h]){let a=[0,0,0],b=[0,0,0],other=[0,1,2].filter(i=>i!==axis);a[axis]=-h;b[axis]=h;a[other[0]]=b[other[0]]=u;a[other[1]]=b[other[1]]=v;edge(a,b)}}
// eight vertices
for(const x of [-h,h])for(const y of [-h,h])for(const z of [-h,h])entity('a-sphere',{position:`${x} ${y} ${z}`,radius:0.12,material:'color:#ff754f;emissive:#aa2200;emissiveIntensity:0.4'});
// labels in world space
entity('a-text',{value:'TROVA 8 VERTICI',position:'0 0 -2.85',align:'center',width:3,color:'#ffffff'});
entity('a-text',{value:'CONTA 12 SPIGOLI',position:'0 0 2.85',rotation:'0 180 0',align:'center',width:3,color:'#ffffff'});
</script></body></html>
