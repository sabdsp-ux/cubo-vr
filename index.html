
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Il cubo misterioso - VR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>

<body>
<a-scene background="color: #101827"
         vr-mode-ui="enabled: true">

  <!-- Pareti del cubo -->
  <a-box position="0 1.6 0"
         width="3.6"
         height="3.6"
         depth="3.6"
         material="color: #38BDF8;
                   opacity: 0.08;
                   transparent: true;
                   side: double">
  </a-box>

  <!-- Spigoli e vertici -->
  <a-entity id="geometria"></a-entity>

  <!-- Telecamera al centro del cubo -->
  <a-entity position="0 1.6 0">
    <a-camera
      look-controls="enabled: true"
      wasd-controls="enabled: false">

      <!-- Domande davanti agli occhi -->
      <a-entity position="0 0.55 -1.4">

        <a-plane
          width="2.3"
          height="0.65"
          color="#14243A"
          opacity="0.88">
        </a-plane>

        <a-text
          value="QUANTI SPIGOLI VEDI?"
          align="center"
          color="#FFFFFF"
          width="2.5"
          position="0 0.14 0.02">
        </a-text>

        <a-text
          value="QUANTI VERTICI VEDI?"
          align="center"
          color="#FFFFFF"
          width="2.5"
          position="0 -0.14 0.02">
        </a-text>

      </a-entity>
    </a-camera>
  </a-entity>

</a-scene>

<script>
  const geometria = document.querySelector("#geometria");

  const valori = [-1.8, 1.8];
  const centroY = 1.6;

  function creaSpigolo(a, b) {
    const linea = document.createElement("a-entity");

    linea.setAttribute("line", {
      start: a.join(" "),
      end: b.join(" "),
      color: "#FFD700"
    });

    geometria.appendChild(linea);
  }

  // I 12 spigoli del cubo
  for (const x of valori) {
    for (const y of valori) {
      creaSpigolo(
        [x, centroY + y, -1.8],
        [x, centroY + y, 1.8]
      );
    }
  }

  for (const x of valori) {
    for (const z of valori) {
      creaSpigolo(
        [x, centroY - 1.8, z],
        [x, centroY + 1.8, z]
      );
    }
  }

  for (const y of valori) {
    for (const z of valori) {
      creaSpigolo(
        [-1.8, centroY + y, z],
        [1.8, centroY + y, z]
      );
    }
  }

  // Sfere arancioni nei vertici
  for (const x of valori) {
    for (const y of valori) {
      for (const z of valori) {
        const sfera = document.createElement("a-sphere");

        sfera.setAttribute(
          "position",
          `${x} ${centroY + y} ${z}`
        );

        sfera.setAttribute("radius", "0.12");
        sfera.setAttribute("color", "#FF8C00");

        geometria.appendChild(sfera);
      }
    }
  }
</script>
</body>
</html>
