<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dentro il cubo — Missioni matematiche VR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>
<a-scene background="color: #101827" vr-mode-ui="enabled: true" renderer="antialias: true">
  <a-entity id="room"></a-entity>
  <a-entity position="0 1.6 0">
    <a-camera look-controls="enabled: true" wasd-controls="enabled: false">
      <!-- Le domande seguono lo sguardo, senza mostrare le risposte. -->
      <a-plane position="0 -0.49 -1.05" width="1.7" height="0.39"
               material="color: #101827; opacity: 0.82; transparent: true; depthTest: false"
               render-order="10"></a-plane>
      <a-text value="Quanti spigoli vedi?\nQuanti vertici vedi?"
              position="0 -0.49 -1.045" width="1.75" align="center"
              color="#FFFFFF" wrap-count="30" line-height="58"
              material="depthTest: false" render-order="11"></a-text>
    </a-camera>
  </a-entity>
</a-scene>
<script>
const room = document.querySelector('#room');
const half = 1.8; // lato 3.6: piu' compatto del precedente lato 6
const eyeHeight = 1.6;
const v = [-half, half];
function vertex(x,y,z) {
  const el = document.createElement('a-sphere');
  el.setAttribute('position', `${x} ${y+eyeHeight} ${z}`);
  el.setAttribute('radius', '0.095');
  el.setAttribute('color', '#FB923C');
  room.appendChild(el);
}
function edge(a,b) {
  const el = document.createElement('a-entity');
  el.setAttribute('line', `start: ${a.join(' ')}; end: ${b.join(' ')}; color: #FDE047`);
  room.appendChild(el);
}
for (const x of v) for (const y of v) for (const z of v) vertex(x,y,z);
for (const y of v) for (const z of v) edge([-half,y+eyeHeight,z],[half,y+eyeHeight,z]);
for (const x of v) for (const z of v) edge([x,-half+eyeHeight,z],[x,half+eyeHeight,z]);
for (const x of v) for (const y of v) edge([x,y+eyeHeight,-half],[x,y+eyeHeight,half]);
const walls = document.createElement('a-box');
walls.setAttribute('position',`0 ${eyeHeight} 0`);
walls.setAttribute('width','3.6');
walls.setAttribute('height','3.6');
walls.setAttribute('depth','3.6');
walls.setAttribute('material','color: #38BDF8; opacity: 0.045; transparent: true; side: double; depthWrite: false');
room.insertBefore(walls, room.firstChild);
</script>
</body>
</html>
